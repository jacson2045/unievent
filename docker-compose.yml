# UniEvent Pay — sistema completo en Docker.
#
#   cp .env.example .env      # completar los secretos
#   docker compose up -d --build
#
# Observabilidad: Prometheus (métricas), Grafana (paneles), Zipkin (trazas), Kafka UI.
# Orden de arranque (depends_on + healthchecks):
#   PostgreSQL x4, Kafka  ->  Config Server  ->  Discovery (Eureka)
#   ->  auth / event / enrollment / notification  ->  API Gateway  ->  Frontend
# Cada servicio declara cuándo está listo con /actuator/health.

name: unievent

x-healthcheck-java: &healthcheck-java
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 40s

x-java-service: &java-service
  restart: unless-stopped
  networks: [unievent]
  environment: &java-env
    # Hora de Perú: las fechas (LocalDateTime) se guardan y muestran en hora local.
    TZ: America/Lima
    SPRING_PROFILES_ACTIVE: dev,docker
    CONFIG_SERVER_URL: http://config-server:18888
    EUREKA_URL: http://discovery-server:8761/eureka/
    JAVA_OPTS: -Xms128m -Xmx320m -XX:+UseSerialGC
    POSTGRES_USER: ${POSTGRES_USER:-unievent}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    # Los archivos *-dev.yml locales referencian estas variables; en Docker usan la misma clave.
    ENROLLMENT_DB_PASSWORD: ${POSTGRES_PASSWORD}
    NOTIFICATION_DB_PASSWORD: ${POSTGRES_PASSWORD}
    JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 64 caracteres)}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8443}

x-postgres: &postgres
  image: postgres:16
  restart: unless-stopped
  networks: [unievent]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  # ---------------------------------------------------------------- datos
  postgres-auth:
    <<: *postgres
    environment:
      POSTGRES_DB: auth_db
      TZ: America/Lima
      POSTGRES_USER: ${POSTGRES_USER:-unievent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes: [pg-auth:/var/lib/postgresql/data]

  postgres-event:
    <<: *postgres
    environment:
      POSTGRES_DB: event_db
      TZ: America/Lima
      POSTGRES_USER: ${POSTGRES_USER:-unievent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg-event:/var/lib/postgresql/data]

  postgres-enrollment:
    <<: *postgres
    environment:
      POSTGRES_DB: enrollment_db
      TZ: America/Lima
      POSTGRES_USER: ${POSTGRES_USER:-unievent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg-enrollment:/var/lib/postgresql/data]

  postgres-notification:
    <<: *postgres
    environment:
      POSTGRES_DB: notification_db
      TZ: America/Lima
      POSTGRES_USER: ${POSTGRES_USER:-unievent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg-notification:/var/lib/postgresql/data]

  kafka:
    image: apache/kafka:4.0.2
    restart: unless-stopped
    networks: [unievent]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # ---------------------------------------------------------- plataforma
  config-server:
    <<: *java-service
    build: ./infra/unievent-config
    environment:
      TZ: America/Lima
      JAVA_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
      # El repositorio de configuración se monta desde el proyecto (editable sin reconstruir).
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./infra/unievent-config/config-repo:/config-repo:ro
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:18888/actuator/health"]

  discovery-server:
    <<: *java-service
    build: ./services/discovery-server
    environment:
      TZ: America/Lima
      JAVA_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
      EUREKA_HOSTNAME: discovery-server
    ports: ["8761:8761"]
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]

  # ------------------------------------------------------- microservicios
  auth-service:
    <<: *java-service
    build: ./services/auth-service
    environment:
      <<: *java-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres-auth: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]

  event-service:
    <<: *java-service
    build: ./services/event-service
    depends_on:
      postgres-event: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]

  enrollment-service:
    <<: *java-service
    build: ./services/enrollment-service
    environment:
      <<: *java-env
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
    depends_on:
      postgres-enrollment: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]

  notification-service:
    <<: *java-service
    build: ./services/notification-service
    depends_on:
      postgres-notification: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]

  # --------------------------------------------------------- entrada única
  api-gateway:
    <<: *java-service
    build: ./services/api-gateway
    environment:
      <<: *java-env
      EUREKA_SERVER_URL: http://discovery-server:8761
    ports: ["8000:8000"]
    depends_on:
      auth-service: { condition: service_healthy }
      event-service: { condition: service_healthy }
      enrollment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD", "curl", "-fs", "http://localhost:8000/actuator/health"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    networks: [unievent]
    ports: ["8443:80"]
    depends_on:
      api-gateway: { condition: service_healthy }

  # ------------------------------------------------------ observabilidad
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    networks: [unievent]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      discovery-server: { condition: service_healthy }

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    networks: [unievent]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # Trazas distribuidas: recorrido completo de cada petición entre servicios (incluye Kafka).
  # Los servicios no dependen de Zipkin: si no está, siguen funcionando y solo no se exportan trazas.
  zipkin:
    image: openzipkin/zipkin:3.5
    restart: unless-stopped
    networks: [unievent]
    environment:
      TZ: America/Lima
    ports: ["9411:9411"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    networks: [unievent]
    environment:
      KAFKA_CLUSTERS_0_NAME: unievent
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8085:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  # ------------------------------------------------- pruebas integrales
  # No arranca con "up": se ejecuta bajo demanda contra el sistema levantado.
  #   docker compose --profile tests run --rm e2e
  e2e:
    image: node:22-alpine
    profiles: [tests]
    networks: [unievent]
    working_dir: /repo
    volumes:
      - ./tests:/repo/tests:ro
    environment:
      E2E_GATEWAY_URL: http://api-gateway:8000
      E2E_EUREKA_URL: http://discovery-server:8761
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["node", "--test", "--test-concurrency=1", "--test-reporter=spec", "tests/e2e/**/*.test.mjs"]
    depends_on:
      api-gateway: { condition: service_healthy }

networks:
  unievent:

volumes:
  pg-auth:
  pg-event:
  pg-enrollment:
  pg-notification:
  kafka-data:
  grafana-data:
