site_name: UniEvent Pay
site_description: Documentación técnica de UniEvent Pay — plataforma distribuida de eventos universitarios
site_author: Yacson Carrizales Chuquimamani
repo_url: https://github.com/jacson2045/unievent
repo_name: jacson2045/unievent
edit_uri: ""

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Inicio: index.md
  - Instalación y ejecución: ejecucion.md
  - Uso del sistema: uso.md
  - Arquitectura:
      - Arquitectura distribuida: arquitectura.md
      - Microservicios y API: microservicios.md
      - Datos y consistencia: datos.md
      - Infraestructura: infraestructura.md
  - Observabilidad: observabilidad.md
  - Validación:
      - Pruebas integrales: pruebas.md
      - Bitácora de validación: bitacora.md
  - Equipo y aporte individual: equipo.md
  - Repositorio y estándares: repositorio.md
  - Limitaciones y mejoras: limitaciones.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
