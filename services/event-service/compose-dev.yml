services:
  postgres-event-dev:
    image: postgres:16
    container_name: unievent-postgres-event-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: unievent
      POSTGRES_PASSWORD: unievent123
    ports:
      - "15434:5432"
    volumes:
      - event_dev_data:/var/lib/postgresql/data

volumes:
  event_dev_data: