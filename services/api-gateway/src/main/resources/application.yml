server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**
            - id: event-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/eventos/**, /api/categorias/**
            - id: enrollment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/inscripciones/**
            - id: notification-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/notificaciones/**
            # Monitoreo: solo el health check de cada servicio (lo usa el panel del administrador).
            - id: monitor-auth
              uri: http://localhost:8082
              predicates:
                - Path=/monitor/auth-service/health
              filters:
                - SetPath=/actuator/health
            - id: monitor-event
              uri: http://localhost:8080
              predicates:
                - Path=/monitor/event-service/health
              filters:
                - SetPath=/actuator/health
            - id: monitor-enrollment
              uri: http://localhost:8083
              predicates:
                - Path=/monitor/enrollment-service/health
              filters:
                - SetPath=/actuator/health
            - id: monitor-notification
              uri: http://localhost:8084
              predicates:
                - Path=/monitor/notification-service/health
              filters:
                - SetPath=/actuator/health
            - id: monitor-config
              uri: http://localhost:18888
              predicates:
                - Path=/monitor/config-server/health
              filters:
                - SetPath=/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG